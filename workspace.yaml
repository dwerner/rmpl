    - "libs/parsing"
    - "libs/yaml-parse"
    - "libs/mylib"
    - "macros/hello_macro"
  
  dependencies:
    parsing: "workspace"
    
  profiles:
    debug:
      target: "target/debug"
      opt_level: 0
      debug: true
    release:
      target: "target/release"
      opt_level: 3
      debug: false
