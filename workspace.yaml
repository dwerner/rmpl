workspace:
  root: "."
  name: "rmpl"
  members:
    - "."
    - "libs/parsing"
    - "libs/yaml-parse"
    - "libs/mylib"
    - "macros/hello_macro"
    - "libs/syn-lite"
    - "libs/quote-lite"
    - "libs/serduh-core"
    - "libs/serduh-yaml"
    - "libs/serduh-derive"
  
  dependencies:
    parsing: "workspace"
    serduh-core: "workspace"
    yaml-parse: "workspace"
    syn-lite: "workspace"
    quote-lite: "workspace"
    
  profiles:
    debug:
      target: "target/debug"
      opt_level: 0
      debug: true
    release:
      target: "target/release"
      opt_level: 3
      debug: false
